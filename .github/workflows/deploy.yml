# Builds the site and publishes it to GitHub Pages on every push to main.
# (Netlify does not use this file; it reads netlify.toml instead.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project pages live at https://<user>.github.io/<repo>/ so the site needs a base path.
      SITE_URL: https://${{ github.repository_owner }}.github.io
      SITE_BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
