# Builds the site and publishes it to GitHub Pages on every push to main.
# (Netlify does not use this file; it reads netlify.toml instead.)
#
# Custom domain: set a repository variable named CUSTOM_DOMAIN (Settings > Secrets and
# variables > Actions > Variables) to e.g. "smallhours.example". The build then drops the
# /<repo>/ prefix and writes the CNAME file GitHub Pages needs. Leave it unset to serve
# from https://<user>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide where the site lives
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
            echo "SITE_BASE=/" >> "$GITHUB_ENV"
            echo "$CUSTOM_DOMAIN" > public/CNAME
          else
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
            echo "SITE_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
