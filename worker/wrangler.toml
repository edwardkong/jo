# Cloudflare Worker that receives notes from readers and commits them to the repo.
# Deploy from this folder:   npx wrangler login && npx wrangler deploy
# Secrets (once):            npx wrangler secret put GITHUB_TOKEN
#                            npx wrangler secret put TURNSTILE_SECRET
name = "small-hours-notes"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
GITHUB_REPO = "edwardkong/jo"
GITHUB_BRANCH = "main"
# No trailing slash. Change when the site moves to Netlify or a custom domain.
SITE_URL = "https://edwardkong.github.io/jo"

# Rate limit: 5 notes per minute per IP. Remove this block if your plan rejects it;
# the Worker works without it (the captcha still applies).
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
