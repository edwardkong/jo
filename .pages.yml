# Pages CMS configuration  -  https://pagescms.org/docs/configuration
#
# This file tells Pages CMS (the phone-friendly editor at app.pagescms.org) what can be
# edited in this repo and how each field is saved. Every key below was checked against
# the Pages CMS 2.1.8 docs and its config validator (lib/config-schema.ts in the
# pages-cms repo); comments say where the docs are thin. Indentation matters: two
# spaces, never tabs. She never needs to open this file; the owner might.

# ----------------------------------------------------------------------------------------
# Photos
#
# "input" is the folder in the repo where uploads land; "output" is the path written into
# a post. They are the same here on purpose: Astro only optimises images it can import,
# and astro.config.mjs turns "/src/assets/uploads/x.jpg" back into an import at build time.
media:
  - name: photos
    label: Photos
    input: src/assets/uploads
    output: /src/assets/uploads
    # Lowercase only. The CMS compares extensions case-sensitively when listing the
    # folder, so a "PHOTO.JPG" copied in by hand will not show in the picker. Uploads made
    # through the CMS are fine: "rename: safe" slugifies the name and lowercases the
    # extension. HEIC is left out because Astro's image tool cannot read it; iPhones send
    # JPEG when the browser asks for one.
    extensions: [jpg, jpeg, png, webp, gif]
    # false = keep the original name, safe = slugify it, random = generated name.
    rename: safe

content:
  # --------------------------------------------------------------------------------------
  # Menu items (the posts). One Markdown file each: frontmatter on top, the writing below.
  # The "body" field is special in Pages CMS: it maps to the text under the frontmatter.
  - name: posts
    label: Posts
    description: One entry per post.
    type: collection
    path: src/content/posts
    # format is inferred from the .md extension (yaml-frontmatter); left implicit.
    #
    # New files are named from the day they are created plus the slugified title, e.g.
    # "2026-09-12-lemon-loaf-second-attempt.md". {primary} is the view.primary field
    # (title) run through slugify(lower, strict). The date in the file name is the
    # creation day, not the "date" field: the site sorts by the field and drops the
    # prefix from the URL, so the two drifting apart is harmless.
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, section, date, draft]
      sort: [date, title]
      search: [title, description]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Also becomes the web address, so two posts with the same title will fight over it."
      - name: description
        label: Short description
        type: string
        description: "One line shown under the title on the homepage."
      - name: section
        label: Section
        type: reference
        required: true
        description: "Which section it is listed under."
        options:
          collection: sections
          # What gets stored. The site keys sections by file name, so it wants
          # "bakes.yml", which is exactly what {name} gives (the referenced entry's file
          # name, extension included; verified in the references API). The default,
          # {path}, would store "src/content/sections/bakes.yml"; the site tolerates that
          # too, but the short form is what everything else expects.
          value: "{name}"
          # What the dropdown shows: the section's heading, not the file name.
          # {primary} is the referenced collection's view.primary (title).
          label: "{primary}"
          # Comma-separated. "primary" and "name" are handled as special tokens.
          search: "primary,name"
      - name: date
        label: Date
        type: date
        description: "Newer sits higher. Starts as today."
        # No "default" on purpose: a date field starts as the current local date unless
        # default: "" is set (docs: Date field, Notes). Saved as yyyy-MM-dd, which is also
        # what the field uses when "format" is omitted; spelled out here so it is visible.
        options:
          format: yyyy-MM-dd
      - name: cover
        label: Cover photo
        type: image
        description: "Optional. Shows on the homepage and at the top of the post. Keep it under about 3 MB."
        # No "required": an empty cover is fine, the site treats "" and missing the same.
        options:
          media: photos
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: true
        description: "On for new posts. Switch it off to publish."
      - name: body
        label: Body
        type: rich-text
        description: "Headings, lists, quotes and photos all work. Photos go next to the cover in the same folder."
        options:
          # markdown is the default; stated so nobody switches it to html by accident.
          format: markdown
          media: photos
          # switcher (Editor/Source toggle) is left at its default, true.

  # --------------------------------------------------------------------------------------
  # Menu sections: the headings on the menu. Posts point at these by file name, so the
  # file name is the stable id and the heading can change freely.
  - name: sections
    label: Sections
    description: The groups posts are listed under on the homepage.
    type: collection
    path: src/content/sections
    # Plain YAML files, no frontmatter. The site reads *.yml only, so the .yml here matters.
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: title
      fields: [title, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Changing the title is fine; renaming the file is not, because posts point at the file name."
      - name: blurb
        label: Short description
        type: text
        description: "A line under the title. Optional."
      - name: order
        label: Order
        type: number
        default: 10
        description: "Lower comes first."
        options:
          min: 0

  # --------------------------------------------------------------------------------------
  # Notes from readers: written by the notes Worker (worker/), one small file per note,
  # grouped in a folder per post. They are live as soon as the site rebuilds. Her job
  # here is only to read them and delete the ones that don't belong.
  - name: comments
    label: Comments
    description: Comments left under posts. Delete anything that does not belong; the site updates by itself.
    type: collection
    path: src/content/comments
    format: yaml
    subfolders: true
    # Nobody writes notes from here, so no "new" button. Deleting and editing stay on.
    operations:
      create: false
    view:
      primary: body
      fields: [body, name, post, date]
      sort: [date]
      search: [body, name, post]
      default:
        sort: date
        order: desc
    fields:
      - name: post
        label: On post
        type: string
        readonly: true
      - name: name
        label: Name
        type: string
        readonly: true
      - name: body
        label: Comment
        type: text
        description: "You can trim a comment if you must; deleting the whole thing is usually kinder."
      - name: date
        label: When
        type: date
        readonly: true
        options:
          time: true

  # --------------------------------------------------------------------------------------
  # Site settings: one JSON file with the name over the door, the sign, the footer.
  - name: site
    label: Site settings
    description: Name, intro, sign, footer, and every phrase the site prints.
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
        required: true
        description: "Shown at the top of the homepage and in the browser tab."
      - name: intro
        label: Intro
        type: text
        description: "A sentence or two under the name."
      - name: sign_text
        label: Sign text
        type: string
        description: "What the hanging sign says."
      - name: sign_link
        label: Sign link
        type: string
        description: "Where the sign goes when tapped. Leave empty and it goes nowhere."
      - name: footer
        label: Footer
        type: string
        description: "The last line on every page."
      - name: noindex
        label: Keep search engines away
        type: boolean
        default: true
        description: "On while this is a prototype. Off if you ever want to be found."
      - name: notes_endpoint
        label: Comment inbox address (owner)
        type: string
        description: "The web address of the comment Worker. Empty switches the comment form off. Set by the owner."
      - name: turnstile_site_key
        label: Captcha site key (owner)
        type: string
        description: "Cloudflare Turnstile site key. Empty means no captcha. Set by the owner."
      - name: look
        label: Look
        type: object
        description: "Fonts, colours, tab icon, and which drawings show. The site rebuilds with the new look after you save."
        fields:
          - name: font_heading
            label: Heading font
            type: string
            description: "A Google Fonts family name, spelled exactly as on fonts.google.com (e.g. Gaegu, Caveat, Patrick Hand). Used for titles, headings, dates, the sign."
          - name: font_body
            label: Body font
            type: string
            description: "A Google Fonts family name for the writing (e.g. Literata, Lora, Source Serif 4). Pick one that has an italic."
          - name: color_background
            label: Background colour
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
            description: "Six-digit hex, like #f3ead9."
          - name: color_background_deep
            label: Background, darker shade
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
            description: "For rules, borders and photo edges."
          - name: color_ink
            label: Text colour
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
            description: "Also the colour of the drawings."
          - name: color_ink_soft
            label: Text colour, lighter
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
            description: "Descriptions, dates, small print."
          - name: color_accent
            label: Accent colour
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
            description: "Hover underline, focus outline, the quote rule. Used sparingly."
          - name: favicon
            label: Tab icon
            type: string
            description: "An emoji or a letter or two, shown in the browser tab. Empty keeps the drawn default."
          - name: show_header_doodle
            label: Show the drawing beside the site name
            type: boolean
            default: true
          - name: show_item_doodles
            label: Show the small drawings beside each post
            type: boolean
            default: true
          - name: show_sign
            label: Show the hanging sign
            type: boolean
            default: true
          - name: show_footer_doodle
            label: Show the drawing at the end of a post
            type: boolean
            default: true
      - name: wording
        label: Wording
        type: object
        description: "Every phrase the site prints that is not a post. Change any of them; the layout does not care."
        fields:
          - name: home_tab
            label: Homepage tab title
            type: string
            description: "Browser tab title of the homepage."
          - name: back_link
            label: Back link
            type: string
            description: "The link at the top of a post and on the not-found page."
          - name: empty_section
            label: Empty section line
            type: string
            description: "Shown under a section with no posts yet."
          - name: unsorted_title
            label: Unsorted section title
            type: string
            description: "Heading for posts whose section was deleted."
          - name: unsorted_blurb
            label: Unsorted section description
            type: string
            description: "Line under that heading. Optional."
          - name: comments_title
            label: Comments heading
            type: string
            description: "Above the comments under a post."
          - name: comments_empty
            label: No comments yet
            type: string
            description: "Shown when a post has no comments."
          - name: comments_form_hint
            label: Comment form hint
            type: text
            description: "The sentence under that label."
          - name: comments_name_label
            label: Name field label
            type: string
          - name: comments_body_label
            label: Comment field label
            type: string
          - name: comments_submit
            label: Send button
            type: string
          - name: comments_sent
            label: After sending
            type: string
            description: "Shown once a comment has gone through."
          - name: comments_failed
            label: If sending fails
            type: string
          - name: comments_off
            label: Comments switched off
            type: string
            description: "Shown while the inbox address is empty."
          - name: comments_anonymous
            label: Name when none given
            type: string
          - name: not_found_tab
            label: Not-found tab title
            type: string
          - name: not_found_title
            label: Not-found heading
            type: string
          - name: not_found_text
            label: Not-found text
            type: text

# ----------------------------------------------------------------------------------------
# Repository-wide behaviour. The validator only allows: config, cache, hide,
# content.merge, commit.templates, commit.identity.
settings:
  commit:
    # "user" puts her name and email on the commit (she is invited as a collaborator by
    # email, no GitHub account needed). The default, "app", would show the Pages CMS app
    # as the committer instead. Note: the docs say "when available"; an email-only
    # collaborator may have no display name, in which case GitHub shows the email.
    identity: user
    # Tokens: {action} {path} {filename} {name} {owner} {repo} {branch} {userName}
    # {userEmail} {oldPath} {newPath} {oldFilename} {newFilename}. {name} is the content
    # or media entry name above ("posts", "sections", "site", "photos").
    templates:
      create: "Add {filename} to {name} (via Pages CMS)"
      update: "Edit {filename} in {name} (via Pages CMS)"
      delete: "Remove {filename} from {name} (via Pages CMS)"
      rename: "Rename {oldFilename} to {newFilename} in {name} (via Pages CMS)"
